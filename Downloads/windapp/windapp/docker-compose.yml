# One container serves the API (/api/*) and the built React UI (/) -> no CORS or proxy needed.
services:
  desk:
    build: .
    image: wind-forecast-desk
    ports:
      - "8000:8000"          # open http://127.0.0.1:8000
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      DATA_DIR: /srv/data
    volumes:
      - ./backend/data:/srv/data   # snapshot files (actuals.json, forecasts.json)
    restart: unless-stopped
